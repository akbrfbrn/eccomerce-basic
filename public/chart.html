<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang - ETERNALY BRAND</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 font-sans">
  <div class="max-w-5xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-lg">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Keranjang Kamu</h1>
      <a href="products.html" class="text-blue-600 hover:underline">Lihat Produk</a>
    </div>
    
    <table class="w-full text-sm">
      <thead class="border-b font-semibold">
        <tr>
          <th class="text-left py-2">Produk</th>
          <th class="text-center">Harga</th>
          <th class="text-center">Qty</th>
          <th class="text-center">Subtotal</th>
          <th class="text-center">Aksi</th>
        </tr>
      </thead>
      <tbody id="cartItems" class="divide-y"></tbody>
    </table>

    <div class="mt-6 flex justify-between items-center bg-gray-100 p-4 rounded">
      <div>
        <p class="text-lg">Total Bayar:</p>
        <p class="font-bold text-xl">Rp <span id="totalAmount">0</span></p>
      </div>
      <a href="checkout.html" class="bg-black text-white px-6 py-2 rounded hover:bg-gray-800">Checkout</a>
      <h2 class="text-center font-extrabold text-lg mb-4">SELAMAT DATANG DI <br> ETERNALY BRAND LOKAL</h2>
    </div>
  </div>

  <script>
    const cartItems = document.getElementById('cartItems');
    const totalAmount = document.getElementById('totalAmount');
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function displayCart() {
      cartItems.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        cartItems.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-gray-500">Keranjang kosong</td></tr>`;
      } else {
        cart.forEach(i => {
          const subtotal = i.price * i.qty;
          total += subtotal;
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="flex items-center gap-2 py-4">
              <img src="${i.image}" alt="" class="w-16 h-16 object-contain rounded" />
              <span>${i.title}</span>
            </td>
            <td class="text-center">Rp ${i.price.toLocaleString('id-ID')}</td>
            <td class="text-center">
              <input type="number" value="${i.qty}" min="1" class="w-12 text-center qty" data-id="${i.id}" />
            </td>
            <td class="text-center">Rp ${subtotal.toLocaleString('id-ID')}</td>
            <td class="text-center">
              <button class="text-red-600 del" data-id="${i.id}">Hapus</button>
            </td>
          `;
          cartItems.appendChild(row);
        });
      }

      totalAmount.textContent = total.toLocaleString('id-ID');
      attachCartListeners();
    }

    function attachCartListeners() {
      document.querySelectorAll('.qty').forEach(input => {
        input.addEventListener('change', e => {
          const id = parseInt(e.target.dataset.id);
          const qty = parseInt(e.target.value) || 1;
          cart = cart.map(i => i.id === id ? { ...i, qty } : i);
          localStorage.setItem('cart', JSON.stringify(cart));
          displayCart();
        });
      });

      document.querySelectorAll('.del').forEach(btn => {
        btn.addEventListener('click', e => {
          const id = parseInt(e.target.dataset.id);
          cart = cart.filter(i => i.id !== id);
          localStorage.setItem('cart', JSON.stringify(cart));
          displayCart();
        });
      });
    }

    displayCart();
  </script>
</body>
</html>
