<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register | Eternaly Brand</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-b from-black via-gray-700 to-black p-6">

  <div class="flex flex-col md:flex-row bg-white shadow-lg rounded-lg overflow-hidden border-4 border-blue-500">
    
   
    <div class="bg-gray-200 p-8 md:w-1/2">
      <h2 class="text-2xl font-extrabold mb-4 text-center">REGISTER</h2>
      
      <label class="block mb-2 text-sm font-semibold">Buatlah username</label>
      <input type="text" placeholder="username anda" class="w-full px-4 py-2 mb-4 rounded-full bg-gradient-to-b from-gray-100 to-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">

      <label class="block mb-2 text-sm font-semibold">masukkan E-mail anda</label>
      <input type="email" placeholder="yourmail@gmail.com" class="w-full px-4 py-2 mb-4 rounded-full bg-gradient-to-b from-gray-100 to-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">

      <label class="block mb-2 text-sm font-semibold">Buatlah password anda!</label>
      <input type="password" placeholder="your password" class="w-full px-4 py-2 mb-4 rounded-full bg-gradient-to-b from-gray-100 to-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">

      <label class="block mb-2 text-sm font-semibold">Konfirmasi password</label>
      <input type="password" placeholder="konfirmasi password" class="w-full px-4 py-2 mb-4 rounded-full bg-gradient-to-b from-gray-100 to-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">

      <a href="login.html" class="w-full bg-gray-700 text-white py-2 rounded font-bold hover:bg-gray-900">REGISTER</a>

      <div class="flex justify-center gap-4 mt-4">
        <button class="bg-white p-2 rounded-full shadow-md hover:bg-gray-300">
          <img src="/image/google.png" class="h-6 w-6" alt="Google"/>
        </button>
        <button class="bg-white p-2 rounded-full shadow-md hover:bg-gray-300">
          <img src="/image/instagram (1).png" class="h-6 w-6" alt="instagram"/>
          
        </button>
      </div>
    </div>

    <div class="bg-blue-100 p-8 flex flex-col items-center justify-center md:w-1/2">
      <h3 class="text-xl font-extrabold text-blue-800 mb-2">SEPATU BRAND LOKAL YANG AKAN DATANG</h3>
      <img src="/image/toko online baju anak, inspirasi template, instagram post..png" alt="Sepatu" class="h-60 w-60 rounded">
    </div>
  </div>

</body>
</html>
