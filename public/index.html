<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETERNALY BRAND</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="bg-gray-100 font-sans">
  <nav class="bg-gray-300 px-4 py-3 flex items-center justify-between border-b-4 border-teal-200">
    <div class="text-sm font-bold">ETERNALY BRAND</div>
    <div class="flex-1 px-4">
      <div class="flex bg-white rounded px-2 py-1 shadow items-center">
        <i class="fas fa-search text-xl text-black mr-2"></i>
        <input id="searchInput" type="text" placeholder="cari produk...." class="w-full text-sm text-gray-500 bg-transparent outline-none font-bold" />
      </div>
    </div>
    <div class="ml-4">
      <a href="register.html" class="bg-black text-white rounded text-sm px-3 py-1 hover:bg-gray-400">Register</a>
    </div>
  </nav>

  <section class="bg-green-100 text-center py-6">
    <h2 class="text-2xl font-bold text-gray-800">LOKAL BRAND</h2>
    <div class="mt-4 flex justify-center gap-4 w-full h-full">
      <img 
        src="/image/Kuning Biru Modern Estetik Blob Toko Sepatu Banner.png" 
        alt="Banner Lokal Brand"
        class="w-2/2 md:w-2/3 lg:w-2/4 h-auto object-contain"
      >
    </div>
  </section>

  <section class="p-4">
    <h3 class="text-center text-xl font-bold mb-4">Produk Terbaru</h3>
    <div id="productContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
    </div>
  </section>

  <footer class="bg-gray-300 border-t-4 border-blue-500 text-black px-6 py-8">
    <div class="flex flex-wrap justify-between">
      <div class="w-full md:w-1/3 mb-6">
        <h2 class="font-bold text-lg mb-2">Layanan Pelanggan</h2>
        <ul class="space-y-1 ml-4 list-disc">
          <li><a href="#" class="hover:underline">Pusat Bantuan</a></li>
          <li>
            <a href="#" class="hover:underline">Cara Pembelian</a>
            <ul class="ml-6 list-disc">
              <li><a href="#" class="hover:underline">Pengiriman</a></li>
            </ul>
          </li>
          <li><a href="#" class="hover:underline">Kebijakan Produk Internasional</a></li>
          <li><a href="#" class="hover:underline">Cara Pengembalian</a></li>
          <li><span>Ada pertanyaan?<br>Hubungi kami di live chat (24 Jam)</span></li>
        </ul>
      </div>

      <div class="w-full md:w-1/3 mb-6 text-center">z
        <h2 class="font-bold text-lg mb-2">Jasa Pengiriman</h2>
        <div class="flex justify-center space-x-4 items-center">
          <img src="/image/ninja expres.png" alt="Ninja Express" class="h-10">
          <img src="/image/J&T.png" alt="J&T Express" class="h-10">
          <img src="/image/J&T cargo.png" alt="J&T Cargo" class="h-10 object-contain">
          <img src="/image/anter aja.png" alt="anter aja" class="h-10 object-contain">
        </div>
        <div class="mt-2">
          <img src="/image/JNE EXPRESS.png" alt="JNE Express" class="h-8 mx-auto">
        </div>
      </div>

      <div class="w-full md:w-1/3 mb-6">
        <h2 class="font-bold text-lg mb-2">Metode Pembayaran</h2>
        <div class="flex items-center space-x-4 mt-2">
          <img src="/image/COD.png" alt="Bayar di Tempat" class="h-8">
          <img src="/image/Screenshot_2025-05-07_131627-removebg-preview 2.png" alt="VISA" class="h-6">
        </div>
      </div>
    </div>
  </footer>

  <script>
    const API_URL = 'https://fakestoreapi.com/products';

    fetch(API_URL)
      .then(response => response.json())
      .then(products => {
        const container = document.getElementById('productContainer');
        products.slice(0, 20).forEach(product => {
          const div = document.createElement('div');
          div.className = 'bg-white p-2 rounded shadow text-center';
          div.innerHTML = `
            <h4 class="text-sm font-bold line-clamp-1">${product.title}</h4>
            <img src="${product.image}" alt="${product.title}" class="w-full h-32 object-contain mb-2">
            <p class="text-red-600 line-through text-sm">Rp ${(product.price * 1.2).toFixed(3)}</p>
            <p class="font-bold text-black">Rp ${product.price.toFixed(3)}</p>
          `;
          container.appendChild(div);
        });
      })
      .catch(error => console.error('Error loading products:', error));
  </script>
</body>
</html>
