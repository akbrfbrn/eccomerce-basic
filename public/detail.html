<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Produk</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black font-sans">
  <div class="max-w-3xl mx-auto mt-10 p-6">
    <div id="productDetail" class="bg-gray-100 rounded-xl p-6 shadow-md">
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get("id") || 1; // Default ke ID 1
    const detailContainer = document.getElementById("productDetail");

    async function loadProduct() {
      const res = await fetch(`https://fakestoreapi.com/products/${productId}`);
      const product = await res.json();

      const price = Math.floor(product.price * 15000);

      detailContainer.innerHTML = `
        <div class="flex flex-col md:flex-row gap-6">
          <img src="${product.image}" alt="${product.title}" class="w-60 h-60 object-contain rounded-lg border" />
          <div class="flex-1">
            <h1 class="text-2xl font-bold mb-2">${product.title}</h1>
            <p class="text-gray-700 mb-2">${product.description}</p>
            <p class="text-red-600 font-bold text-xl mb-4">Rp ${price.toLocaleString("id-ID")}</p>
            <a href="keranjang.html" onclick="addToCart(${product.id})" class="bg-black text-white px-3 py-2 rounded hover:bg-gray-800">
              Masukan ke Keranjang
            <a href="checkout.html" onclick="addToCart(${product.id})" class="bg-black text-white px-4 py-2 rounded hover:bg-gray-800">
              Beli sekarang
            </button>
          </div>
        </div>
      `;
    }

    function addToCart(id) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      const index = cart.findIndex(item => item.id === id);
      if (index > -1) {
        cart[index].qty += 1;
      } else {
        cart.push({ id: id, qty: 1 });
      }
      localStorage.setItem("cart", JSON.stringify(cart));
      alert("Produk ditambahkan ke keranjang!");
    }

    loadProduct();
  </script>
</body>
</html>
